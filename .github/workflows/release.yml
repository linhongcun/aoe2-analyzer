name: Release
on:
  workflow_run:
    workflows: ['CI / Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: '已成功部署的 main 分支 CI / Deploy run ID；用该次产物恢复发布'
        required: true
        type: string
permissions: { contents: write, actions: read }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
    steps:
      - name: Resolve deployed commit and version
        id: source
        run: |
          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")
          echo "$run_json" | node -e '
            const run = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (run.name !== "CI / Deploy" || run.event !== "push" || run.head_branch !== "main" || run.conclusion !== "success")
              throw new Error("Source run is not a successful main CI / Deploy push run");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "sha=" + run.head_sha + "\n");
          '
      - uses: actions/checkout@v4
        with: { ref: '${{ steps.source.outputs.sha }}', fetch-depth: 0 }
      - name: Decide whether this version still needs a Release
        id: decide
        run: |
          version="v$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "Release $version already published; nothing to do"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null && [ "$(git rev-list -n1 "$version")" != "${{ steps.source.outputs.sha }}" ]; then
            echo "Tag $version points elsewhere; refusing to overwrite"; exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Download the exact deployed site
        if: steps.decide.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with: { name: site, path: dist, run-id: '${{ env.CI_RUN_ID }}', github-token: '${{ github.token }}' }
      - name: Package the deployed site
        if: steps.decide.outputs.publish == 'true'
        run: |
          version=${{ steps.decide.outputs.version }}
          (cd dist && zip -qr "../aoe2-analyzer-site-$version.zip" .)
          sha256sum "aoe2-analyzer-site-$version.zip" > SHA256SUMS.txt
      - name: Publish Release
        if: steps.decide.outputs.publish == 'true'
        run: |
          version=${{ steps.decide.outputs.version }}
          notes="变更内容见 https://github.com/${GITHUB_REPOSITORY}/blob/${{ steps.source.outputs.sha }}/CHANGELOG.md"
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" "aoe2-analyzer-site-$version.zip" SHA256SUMS.txt --clobber
            gh release edit "$version" --draft=false --notes "$notes"
          else
            gh release create "$version" "aoe2-analyzer-site-$version.zip" SHA256SUMS.txt \
              --target "${{ steps.source.outputs.sha }}" --title "$version" --notes "$notes"
          fi
