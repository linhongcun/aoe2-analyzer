name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '待发布的版本号，例如 v0.12.0'
        required: true
        type: string
permissions: { contents: write, actions: read, checks: read }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      # 从 main 调度，签出 release 分支；发版任务自身的 check 不占用 release 头部的 CI 门禁。
      - name: Validate dispatch
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@v4
        with:
          ref: release/${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Check package version
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal('v' + JSON.parse(fs.readFileSync('package.json')).version, process.env.RELEASE_VERSION);"
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deployment, tag and draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'hongcun lin'
          git config user.email 'linhongcun2021@gmail.com'
          npm run release -- "$RELEASE_VERSION"
      - name: Verify published pages
        env:
          BASE_URL: https://linhongcun.github.io/aoe2-analyzer/
        run: npx playwright test tests/e2e/maps34.spec.ts tests/e2e/patches16.spec.ts tests/e2e/share78.spec.ts tests/e2e/production204.spec.ts tests/e2e/upgrades205.spec.ts tests/e2e/civRequirements206.spec.ts tests/e2e/ecoPayoff214.spec.ts tests/e2e/market215.spec.ts --reporter=line
      - name: Build downloadable site from the verified tag
        run: |
          git switch --detach "$RELEASE_VERSION"
          npm run build
          git diff --exit-code
          asset_dir="$RUNNER_TEMP/aoe2-release"
          mkdir -p "$asset_dir"
          cd dist
          zip -q -r "$asset_dir/aoe2-analyzer-$RELEASE_VERSION.zip" .
          cd "$asset_dir"
          sha256sum "aoe2-analyzer-$RELEASE_VERSION.zip" > SHA256SUMS.txt
      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_VERSION" "$RUNNER_TEMP/aoe2-release/aoe2-analyzer-$RELEASE_VERSION.zip" "$RUNNER_TEMP/aoe2-release/SHA256SUMS.txt" --clobber
          gh release edit "$RELEASE_VERSION" --draft=false --latest
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: release-test-results, path: test-results, if-no-files-found: ignore }
