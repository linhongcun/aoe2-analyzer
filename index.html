const K=["骑兵","弓手","步兵","经济","防御","攻城","僧侣","海军"],TY={cav:"骑兵",arch:"弓手",inf:"步兵",naval:"海军",monk:"僧侣",siege:"攻城",def:"防御",eco:"经济"};
const civs=C;
const $=s=>document.querySelector(s);
function sw(c){const a=c.s.map((v,i)=>[v,K[i]]).sort((x,y)=>y[0]-x[0]);return[a.slice(0,3).map(x=>x[1]),a.slice(-3).map(x=>x[1])]}
function radar(cv,list){const x=cv.getContext("2d"),W=cv.width,H=cv.height,cx=W/2,cy=H/2,R=Math.min(W,H)/2-40,L=[...K,"边位","口袋"],n=L.length;x.clearRect(0,0,W,H);x.font="13px sans-serif";
for(let r=1;r<=5;r++){x.beginPath();for(let i=0;i<=n;i++){const a=i/n*2*Math.PI-Math.PI/2,p=R*r/5;x.lineTo(cx+p*Math.cos(a),cy+p*Math.sin(a))}x.strokeStyle="#5a4a32";x.stroke()}
L.forEach((l,i)=>{const a=i/n*2*Math.PI-Math.PI/2;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a));x.stroke();x.fillStyle="#e8d5a3";x.textAlign="center";x.fillText(l,cx+(R+22)*Math.cos(a),cy+(R+18)*Math.sin(a)+4)});
const col=["rgba(212,160,23,","rgba(80,160,220,"];list.forEach((c,k)=>{const v=[...c.s,c.fl,c.pk];x.beginPath();v.forEach((s,i)=>{const a=i/n*2*Math.PI-Math.PI/2;x.lineTo(cx+R*s/10*Math.cos(a),cy+R*s/10*Math.sin(a))});x.closePath();x.fillStyle=col[k]+"0.3)";x.fill();x.strokeStyle=col[k]+"1)";x.lineWidth=2;x.stroke();x.lineWidth=1})}
function opts(){return civs.map((c,i)=>`<option value=${i}>${c.zh} ${c.en}</option>`).join("")}
function list(){const q=$("#q").value.toLowerCase(),t=$("#ty").value,p=$("#pos").value;let r=civs.map((c,i)=>[c,i]).filter(([c])=>(c.en.toLowerCase().includes(q)||c.zh.includes(q))&&(!t||c.ty.includes(t))&&(!p||(p=="fl"?c.fl>=7:c.pk>=7)));
$("#grid").innerHTML=r.map(([c,i])=>`<div class=card onclick=show(${i})><h3>${c.zh}</h3><small>${c.en}</small><div>${c.ty.map(t=>`<span class=tag>${TY[t]}</span>`).join("")}</div><div class=mini>边位 ${c.fl} · 口袋 ${c.pk}</div></div>`).join("")||"<p>无匹配文明</p>";$("#cnt").textContent=r.length+" / "+civs.length}
function show(i){const c=civs[i],[s,w]=sw(c);tab("detail");$("#detail").innerHTML=`<button onclick="tab('list')">← 返回列表</button><h2>${c.zh} <small>${c.en}</small></h2><div class=two><div>
<p><b>官方定位：</b>${c.desc}　<b>筛选标签：</b>${c.ty.map(t=>TY[t]).join(" / ")}</p><p><b>特色兵种：</b>${c.uu}</p><p><b>城堡时代独特科技：</b>${c.ct}</p><p><b>帝王时代独特科技：</b>${c.it}</p><p><b>文明加成：</b></p><ul>${c.bon.map(b=>`<li>${b}</li>`).join("")}</ul><p><b>团队加成：</b>${c.tb} <small class=note>(${c.tbEn})</small></p>
<p class=g><b>优势：</b>${s.join("、")}</p><p class=r><b>劣势：</b>${w.join("、")}</p><p><b>推荐团战位置：</b>${c.fl>=c.pk?"边位 Flank":"口袋 Pocket"}（边位 ${c.fl}/10，口袋 ${c.pk}/10）</p><p><b>推荐开局：</b>${c.op}</p></div><div><canvas id=rd width=440 height=440></canvas><p class=note>评分为主观近似值，仅供参考</p></div></div>`;radar($("#rd"),[c])}
function cmp(){const a=civs[$("#ca").value],b=civs[$("#cb").value],L=[...K,"边位","口袋"],va=[...a.s,a.fl,a.pk],vb=[...b.s,b.fl,b.pk];
$("#ctab").innerHTML=`<tr><th></th><th style=color:#d4a017>${a.zh}</th><th style=color:#50a0dc>${b.zh}</th></tr>`+L.map((l,i)=>`<tr><td>${l}</td><td class=${va[i]>vb[i]?"win":""}>${va[i]}</td><td class=${vb[i]>va[i]?"win":""}>${vb[i]}</td></tr>`).join("")+[["特色兵种","uu"],["城堡科技","ct"],["帝王科技","it"],["团队加成","tb"],["开局","op"]].map(([l,k])=>`<tr><td>${l}</td><td>${a[k]}</td><td>${b[k]}</td></tr>`).join("");radar($("#crd"),[a,b])}
const CT={cav:"长矛兵/戟兵 + 骆驼 + 僧侣转化；用城墙/长矛阵限制机动",arch:"散兵/精英散兵 + 冲车/投石；侦察骑兵或骑士快速贴脸；轻骑兵绕后",inf:"弓手/手炮远程放风筝；用骑兵或骑射拉扯；城堡期蝎子克制密集步兵",naval:"在水图早出火船/战舰抢水；陆图则无需担心，压制其陆军",monk:"轻骑兵/鹰战士猎杀僧侣；分散阵型；具有转化抗性的单位",siege:"骑兵/轻骑兵直切攻城武器；保持冲车阵型分散",def:"避免强攻城墙塔楼，转为经济压制与攻城武器推进；多点骚扰",eco:"早期骚扰（侦察/民兵）打断其发育节奏，别让其速城堡"};
function mu(){const a=civs[$("#ma").value],e=civs[$("#me").value],[es,ew]=sw(e);const best=K.map((k,i)=>[a.s[i]-e.s[i],k]).sort((x,y)=>y[0]-x[0]);
$("#mres").innerHTML=`<h3>${a.zh} vs ${e.zh}</h3><p><b>对手强项：</b>${es.join("、")}；<b>弱项：</b>${ew.join("、")}</p><p><b>你的相对优势：</b>${best.slice(0,3).filter(x=>x[0]>0).map(x=>x[1]+"(+"+x[0]+")").join("、")||"无明显优势，建议稳健发育"}</p><p><b>针对对手兵种的反制：</b></p><ul>${e.ty.map(t=>`<li><b>${TY[t]}：</b>${CT[t]}</li>`).join("")}</ul><p><b>建议：</b>${e.s[3]>=8?"对手经济强，前期主动骚扰。":"对手经济一般，可以稳健发育拖后期。"}${a.s[0]>=8?"你骑兵强，可攻击对方后排弓手和攻城武器。":""}${ew.includes("骑兵")?"对手缺骑兵，你可以多用远程单位。":""}</p><p class=note>自动生成的建议，基于主观评分，仅供参考</p>`}
function tab(t){document.querySelectorAll(".pane").forEach(p=>p.style.display=p.id==t?"block":"none");document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t||(t=="detail"&&b.dataset.t=="list")))}
window.onload=()=>{["#ca","#cb","#ma","#me"].forEach((s,i)=>{$(s).innerHTML=opts();$(s).value=[16,5,16,5][i]});["#q","#ty","#pos"].forEach(s=>$(s).oninput=list);["#ca","#cb"].forEach(s=>$(s).onchange=cmp);["#ma","#me"].forEach(s=>$(s).onchange=mu);list();cmp();mu();tab("list")};
</script></body></html>
