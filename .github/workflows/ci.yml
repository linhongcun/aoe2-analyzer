name: CI / Deploy
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
    inputs:
      deploy:
        description: '从 main 部署 Pages 并触发自动 Release（由版本汇总步骤自动调用，或人工恢复部署）'
        required: false
        default: false
        type: boolean
      expected_sha:
        description: '可选：校验本次部署的精确 main 提交 SHA（防并发覆盖）'
        required: false
        default: ''
        type: string
permissions: { contents: read }
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy != true) && format('ci-readonly-{0}-{1}', github.ref, github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write, actions: write }
    outputs:
      action: ${{ steps.plan.outputs.action }}
      bump_sha: ${{ steps.plan.outputs.bump_sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: '20.19.5' }
      - name: Consume pending release notes and dispatch deploy
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DEPLOY_INPUT: ${{ inputs.deploy == true }}
        run: node scripts/release-workflow.mjs --prepare
  check:
    needs: prepare
    if: ${{ !failure() && !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.deploy != true || github.ref != 'refs/heads/main')) || (needs.prepare.result == 'success' && needs.prepare.outputs.action == 'direct')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deploy_eligible: ${{ steps.target.outputs.deploy_eligible }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: "${{ github.event_name == 'pull_request' && 2 || 1 }}" }
      - name: Detect documentation-only PR
        id: scope
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: '${{ github.event.pull_request.base.sha }}'
        run: node scripts/check-pr-docs-only.mjs
      - uses: actions/setup-node@v4
        with: { node-version: '20.19.5', cache: "${{ steps.scope.outputs.docs_only != 'true' && 'npm' || '' }}" }
      - name: PR title (Conventional Commits)
        if: github.event_name == 'pull_request'
        env: { PR_TITLE: '${{ github.event.pull_request.title }}' }
        run: node scripts/check-pr-title.mjs
      - name: PR release-notes guard
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_only != 'true'
        env:
          PR_BASE_SHA: '${{ github.event.pull_request.base.sha }}'
        run: node scripts/release-notes.mjs --check-pr
      - name: Documentation boundary
        if: steps.scope.outputs.docs_only == 'true'
        run: node scripts/check-docs-boundary.mjs
      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: npm ci --legacy-peer-deps
      - name: Static checks
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/ci-commands.mjs static
      - uses: actions/cache@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright chromium
        if: steps.scope.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium || (sleep 30 && npx playwright install --with-deps chromium)
      - name: Build the checked-out commit
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run build
      - name: Narrow browser smoke against this build
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/ci-commands.mjs smoke
      - name: Mark deployment eligibility
        id: target
        run: |
          if [ "${{ github.ref == 'refs/heads/main' && needs.prepare.result == 'success' && needs.prepare.outputs.action == 'direct' }}" = "true" ]; then
            echo "deploy_eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_eligible=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: browser-diagnostics, path: test-results, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: steps.target.outputs.deploy_eligible == 'true'
        with: { name: site, path: dist, if-no-files-found: error }
      - uses: actions/upload-pages-artifact@v3
        if: steps.target.outputs.deploy_eligible == 'true'
        with: { path: dist }
  deploy:
    needs: check
    if: ${{ github.ref == 'refs/heads/main' && needs.check.outputs.deploy_eligible == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { pages: write, id-token: write, actions: write }
    concurrency: { group: pages, cancel-in-progress: false }
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Dispatch Release workflow for workflow_dispatch deploy
        if: ${{ success() && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          for attempt in 1 2; do
            if gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f "ci_run_id=${CI_RUN_ID}"; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "gh workflow run release.yml 第 ${attempt} 次失败，5 秒后重试"
              sleep 5
            fi
          done
          echo "::warning title=Release 自动派发失败::Pages 部署已成功，但派发 release.yml 两次均失败；请使用本次 run ID 恢复正式 Release：gh workflow run release.yml --ref main -f ci_run_id=${CI_RUN_ID}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Release 自动派发失败"
              echo ""
              echo "Pages 部署已成功，请执行以下命令恢复正式 Release："
              echo ""
              echo '```bash'
              echo "gh workflow run release.yml --ref main -f ci_run_id=${CI_RUN_ID}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
