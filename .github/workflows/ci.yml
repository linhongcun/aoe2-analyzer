name: CI / Deploy
on:
  push: { branches: [main, 'release/**'] }
  pull_request: { branches: [main, 'release/**'] }
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: '完整后台回归（不部署）'
        type: boolean
        default: true
      disable_reuse:
        description: '禁用阶段复用，按当前必要范围重新执行'
        type: boolean
        default: false
permissions: { contents: read, pull-requests: read, actions: read }
concurrency:
  group: ci-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'background' || 'delivery' }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI_FULL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
  CI_DISABLE_REUSE: ${{ inputs.disable_reuse == true }}
  GH_TOKEN: ${{ github.token }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      origin_ms: ${{ steps.clock.outputs.origin_ms }}
      deadline_ms: ${{ steps.clock.outputs.deadline_ms }}
      static: ${{ steps.plan.outputs.static }}
      static_main: ${{ steps.plan.outputs.static_main }}
      unit: ${{ steps.plan.outputs.unit }}
      data: ${{ steps.plan.outputs.data }}
      browser: ${{ steps.plan.outputs.browser }}
      unit_chromium: ${{ steps.plan.outputs.unit_chromium }}
      node_version: ${{ steps.plan.outputs.node_version }}
      python_version: ${{ steps.plan.outputs.python_version }}
    steps:
      - name: Start absolute run clock before checkout
        timeout-minutes: 1
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`},signal:AbortSignal.timeout(10000)});
          if(!response.ok) throw new Error('Cannot establish authoritative workflow clock');
          const run=await response.json();
          if(run.id!==Number(process.env.GITHUB_RUN_ID)||run.run_attempt!==Number(process.env.GITHUB_RUN_ATTEMPT)) throw new Error('Wrong workflow attempt');
          const origin=Date.parse(run.created_at),deadline=origin+1800000;
          if(!Number.isSafeInteger(origin)||Date.now()>=deadline) throw new Error('Workflow deadline exceeded before checkout');
          appendFileSync(process.env.GITHUB_ENV,`CI_RUN_EPOCH_MS=${origin}\nCI_DEADLINE_MS=${deadline}\n`);
          NODE
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with: { fetch-depth: 0 }
      - name: Verify authoritative clock
        id: clock
        run: node scripts/ci-budget.mjs --init
      - uses: actions/setup-node@v4
        timeout-minutes: 2
        with: { node-version: '20.19.5', cache: npm }
      - uses: actions/setup-python@v5
        timeout-minutes: 2
        with: { python-version: '3.12.12' }
      - name: PR title (Conventional Commits)
        if: github.event_name == 'pull_request'
        env: { PR_TITLE: '${{ github.event.pull_request.title }}' }
        run: node scripts/ci-budget.mjs --run -- node scripts/check-pr-title.mjs
      - run: node scripts/ci-budget.mjs --run -- npm ci --legacy-peer-deps
      - name: Freeze exact selections and verified phase reuse
        id: plan
        run: node scripts/ci-stage.mjs plan
      - uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: ci-plan-v2
          path: ${{ runner.temp }}/ci-state
          if-no-files-found: error
          overwrite: true
      - run: node scripts/ci-budget.mjs --assert
  static:
    needs: plan
    if: needs.plan.outputs.static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_RUN_EPOCH_MS: ${{ needs.plan.outputs.origin_ms }}
      CI_DEADLINE_MS: ${{ needs.plan.outputs.deadline_ms }}
    steps:
      - name: Check remaining deadline after queue
        run: |
          node -e 'if (!/^\d+$/.test(process.env.CI_DEADLINE_MS||"" ) || Date.now() >= Number(process.env.CI_DEADLINE_MS)) throw Error("Workflow deadline exceeded in queue")'
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with: { fetch-depth: 0 }
      - run: node scripts/ci-budget.mjs --assert
      - uses: actions/setup-node@v4
        timeout-minutes: 2
        with: { node-version: '${{ needs.plan.outputs.node_version }}', cache: npm }
      - uses: actions/setup-python@v5
        timeout-minutes: 2
        with: { python-version: '${{ needs.plan.outputs.python_version }}' }
      - run: node scripts/ci-budget.mjs --run -- npm ci --legacy-peer-deps
      - uses: actions/download-artifact@v4
        timeout-minutes: 2
        with: { name: ci-plan-v2, path: '${{ runner.temp }}/ci-state' }
      - run: node scripts/ci-budget.mjs --assert
      - name: Execute static phase
        id: phase
        run: node scripts/ci-stage.mjs run static
      - uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: ${{ steps.phase.outputs.artifact_name }}
          path: ${{ runner.temp }}/static/receipt.json
          if-no-files-found: error
          overwrite: true
      - run: node scripts/ci-budget.mjs --assert
  static-main:
    needs: plan
    if: needs.plan.outputs.static_main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_RUN_EPOCH_MS: ${{ needs.plan.outputs.origin_ms }}
      CI_DEADLINE_MS: ${{ needs.plan.outputs.deadline_ms }}
    steps:
      - name: Check remaining deadline after queue
        run: |
          node -e 'if (!/^\d+$/.test(process.env.CI_DEADLINE_MS||"" ) || Date.now() >= Number(process.env.CI_DEADLINE_MS)) throw Error("Workflow deadline exceeded in queue")'
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with: { fetch-depth: 0 }
      - run: node scripts/ci-budget.mjs --assert
      - uses: actions/setup-node@v4
        timeout-minutes: 2
        with: { node-version: '${{ needs.plan.outputs.node_version }}', cache: npm }
      - uses: actions/setup-python@v5
        timeout-minutes: 2
        with: { python-version: '${{ needs.plan.outputs.python_version }}' }
      - run: node scripts/ci-budget.mjs --run -- npm ci --legacy-peer-deps
      - uses: actions/download-artifact@v4
        timeout-minutes: 2
        with: { name: ci-plan-v2, path: '${{ runner.temp }}/ci-state' }
      - run: node scripts/ci-budget.mjs --assert
      - name: Execute static-main phase
        id: phase
        run: node scripts/ci-stage.mjs run static-main
      - uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: ${{ steps.phase.outputs.artifact_name }}
          path: ${{ runner.temp }}/static-main/receipt.json
          if-no-files-found: error
          overwrite: true
      - run: node scripts/ci-budget.mjs --assert
  unit:
    needs: plan
    if: needs.plan.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_RUN_EPOCH_MS: ${{ needs.plan.outputs.origin_ms }}
      CI_DEADLINE_MS: ${{ needs.plan.outputs.deadline_ms }}
    steps:
      - name: Check remaining deadline after queue
        run: |
          node -e 'if (!/^\d+$/.test(process.env.CI_DEADLINE_MS||"" ) || Date.now() >= Number(process.env.CI_DEADLINE_MS)) throw Error("Workflow deadline exceeded in queue")'
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with: { fetch-depth: 0 }
      - run: node scripts/ci-budget.mjs --assert
      - uses: actions/setup-node@v4
        timeout-minutes: 2
        with: { node-version: '${{ needs.plan.outputs.node_version }}', cache: npm }
      - uses: actions/setup-python@v5
        timeout-minutes: 2
        with: { python-version: '${{ needs.plan.outputs.python_version }}' }
      - run: node scripts/ci-budget.mjs --run -- npm ci --legacy-peer-deps
      - uses: actions/download-artifact@v4
        timeout-minutes: 2
        with: { name: ci-plan-v2, path: '${{ runner.temp }}/ci-state' }
      - run: node scripts/ci-budget.mjs --assert
      - name: Cache Playwright browsers
        if: needs.plan.outputs.unit_chromium == 'true'
        uses: actions/cache@v4
        timeout-minutes: 2
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright chromium under shared deadline
        if: needs.plan.outputs.unit_chromium == 'true'
        run: node scripts/ci-stage.mjs install-browser
      - name: Execute unit phase
        id: phase
        run: node scripts/ci-stage.mjs run unit
      - uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: ${{ steps.phase.outputs.artifact_name }}
          path: ${{ runner.temp }}/unit/receipt.json
          if-no-files-found: error
          overwrite: true
      - run: node scripts/ci-budget.mjs --assert
  data:
    needs: plan
    if: needs.plan.outputs.data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_RUN_EPOCH_MS: ${{ needs.plan.outputs.origin_ms }}
      CI_DEADLINE_MS: ${{ needs.plan.outputs.deadline_ms }}
    steps:
      - name: Check remaining deadline after queue
        run: |
          node -e 'if (!/^\d+$/.test(process.env.CI_DEADLINE_MS||"" ) || Date.now() >= Number(process.env.CI_DEADLINE_MS)) throw Error("Workflow deadline exceeded in queue")'
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with: { fetch-depth: 0 }
      - run: node scripts/ci-budget.mjs --assert
      - uses: actions/setup-node@v4
        timeout-minutes: 2
        with: { node-version: '${{ needs.plan.outputs.node_version }}', cache: npm }
      - uses: actions/setup-python@v5
        timeout-minutes: 2
        with: { python-version: '${{ needs.plan.outputs.python_version }}' }
      - run: node scripts/ci-budget.mjs --run -- npm ci --legacy-peer-deps
      - uses: actions/download-artifact@v4
        timeout-minutes: 2
        with: { name: ci-plan-v2, path: '${{ runner.temp }}/ci-state' }
      - run: node scripts/ci-budget.mjs --assert
      - uses: actions/cache@v4
        timeout-minutes: 2
        with:
          path: |
            scripts/.cache/empires2_x2_p1.*.dat
            scripts/.cache/dat.*.json
            scripts/.cache/venv
            scripts/.cache/aoe2techtree-*
          key: data-${{ hashFiles('scripts/data_sources.json') }}-py312
      - run: node scripts/ci-budget.mjs --run -- python3 -m pip install Pillow==12.3.0
      - name: Execute data phase
        id: phase
        run: node scripts/ci-stage.mjs run data
      - uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: ${{ steps.phase.outputs.artifact_name }}
          path: ${{ runner.temp }}/data/receipt.json
          if-no-files-found: error
          overwrite: true
      - run: node scripts/ci-budget.mjs --assert
  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_RUN_EPOCH_MS: ${{ needs.plan.outputs.origin_ms }}
      CI_DEADLINE_MS: ${{ needs.plan.outputs.deadline_ms }}
    steps:
      - name: Check remaining deadline after queue
        run: |
          node -e 'if (!/^\d+$/.test(process.env.CI_DEADLINE_MS||"" ) || Date.now() >= Number(process.env.CI_DEADLINE_MS)) throw Error("Workflow deadline exceeded in queue")'
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with: { fetch-depth: 0 }
      - run: node scripts/ci-budget.mjs --assert
      - uses: actions/setup-node@v4
        timeout-minutes: 2
        with: { node-version: '${{ needs.plan.outputs.node_version }}', cache: npm }
      - uses: actions/setup-python@v5
        timeout-minutes: 2
        with: { python-version: '${{ needs.plan.outputs.python_version }}' }
      - run: node scripts/ci-budget.mjs --run -- npm ci --legacy-peer-deps
      - uses: actions/download-artifact@v4
        timeout-minutes: 2
        with: { name: ci-plan-v2, path: '${{ runner.temp }}/ci-state' }
      - run: node scripts/ci-budget.mjs --assert
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        timeout-minutes: 2
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright chromium under shared deadline
        run: node scripts/ci-stage.mjs install-browser
      - name: Execute build phase
        id: phase
        run: node scripts/ci-stage.mjs run build
      - uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: ci-build-v2
          path: ${{ runner.temp }}/ci-build
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: ${{ steps.phase.outputs.artifact_name }}
          path: ${{ runner.temp }}/build/receipt.json
          if-no-files-found: error
          overwrite: true
      - run: node scripts/ci-budget.mjs --assert
  browser:
    needs: [plan, build]
    if: needs.plan.outputs.browser != '[]'
    name: browser-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix: { shard: '${{ fromJSON(needs.plan.outputs.browser) }}' }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_RUN_EPOCH_MS: ${{ needs.plan.outputs.origin_ms }}
      CI_DEADLINE_MS: ${{ needs.plan.outputs.deadline_ms }}
    steps:
      - name: Check remaining deadline after queue
        run: |
          node -e 'if (!/^\d+$/.test(process.env.CI_DEADLINE_MS||"" ) || Date.now() >= Number(process.env.CI_DEADLINE_MS)) throw Error("Workflow deadline exceeded in queue")'
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with: { fetch-depth: 0 }
      - run: node scripts/ci-budget.mjs --assert
      - uses: actions/setup-node@v4
        timeout-minutes: 2
        with: { node-version: '${{ needs.plan.outputs.node_version }}', cache: npm }
      - uses: actions/setup-python@v5
        timeout-minutes: 2
        with: { python-version: '${{ needs.plan.outputs.python_version }}' }
      - run: node scripts/ci-budget.mjs --run -- npm ci --legacy-peer-deps
      - uses: actions/download-artifact@v4
        timeout-minutes: 2
        with: { name: ci-plan-v2, path: '${{ runner.temp }}/ci-state' }
      - run: node scripts/ci-budget.mjs --assert
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        timeout-minutes: 2
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright chromium under shared deadline
        run: node scripts/ci-stage.mjs install-browser
      - uses: actions/download-artifact@v4
        timeout-minutes: 2
        with: { name: ci-build-v2, path: '${{ runner.temp }}/ci-build' }
      - name: Execute browser phase
        id: phase
        run: node scripts/ci-stage.mjs run browser-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: ${{ steps.phase.outputs.artifact_name }}
          path: ${{ runner.temp }}/browser-${{ matrix.shard }}/receipt.json
          if-no-files-found: error
          overwrite: true
      - run: node scripts/ci-budget.mjs --assert
      - name: Save browser diagnostics (never validation evidence)
        uses: actions/upload-artifact@v4
        if: failure()
        timeout-minutes: 1
        with: { name: 'browser-diagnostics-${{ matrix.shard }}', path: test-results, if-no-files-found: ignore, overwrite: true }
  test:
    needs: [plan, static, static-main, unit, data, build, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_RUN_EPOCH_MS: ${{ needs.plan.outputs.origin_ms }}
      CI_DEADLINE_MS: ${{ needs.plan.outputs.deadline_ms }}
    steps:
      - name: Check remaining deadline after queue
        run: |
          node -e 'if (!/^\d+$/.test(process.env.CI_DEADLINE_MS||"" ) || Date.now() >= Number(process.env.CI_DEADLINE_MS)) throw Error("Workflow deadline exceeded in queue")'
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with: { fetch-depth: 0 }
      - run: node scripts/ci-budget.mjs --assert
      - uses: actions/setup-node@v4
        timeout-minutes: 2
        with: { node-version: '${{ needs.plan.outputs.node_version }}', cache: npm }
      - uses: actions/setup-python@v5
        timeout-minutes: 2
        with: { python-version: '${{ needs.plan.outputs.python_version }}' }
      - run: node scripts/ci-budget.mjs --run -- npm ci --legacy-peer-deps
      - uses: actions/download-artifact@v4
        timeout-minutes: 2
        with: { name: ci-plan-v2, path: '${{ runner.temp }}/ci-state' }
      - run: node scripts/ci-budget.mjs --assert
      - uses: actions/download-artifact@v4
        timeout-minutes: 2
        with: { name: ci-build-v2, path: '${{ runner.temp }}/ci-build' }
      - name: Strict aggregate of every required phase
        run: node scripts/ci-stage.mjs aggregate
      - uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: ci-validation-evidence
          path: ${{ runner.temp }}/ci-gate/receipt.json
          if-no-files-found: error
          overwrite: true
      - name: Save exact deployed site for Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: deployed-site
          path: ${{ runner.temp }}/ci-build/dist
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 2
        with: { path: '${{ runner.temp }}/ci-build/dist' }
      - run: node scripts/ci-report.mjs
      - run: node scripts/ci-budget.mjs --assert
  deploy:
    needs: [plan, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, actions: read, pages: write, id-token: write }
    concurrency: { group: pages, cancel-in-progress: false }
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    env:
      CI_RUN_EPOCH_MS: ${{ needs.plan.outputs.origin_ms }}
      CI_DEADLINE_MS: ${{ needs.plan.outputs.deadline_ms }}
    steps:
      - name: Check remaining deadline after deploy queue
        run: |
          node -e 'if (!/^\d+$/.test(process.env.CI_DEADLINE_MS||"") || Date.now() >= Number(process.env.CI_DEADLINE_MS)) throw Error("Workflow deadline exceeded in deploy queue")'
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with: { persist-credentials: false }
      - run: node scripts/ci-budget.mjs --assert
      - uses: actions/download-artifact@v4
        timeout-minutes: 2
        with: { name: ci-build-v2, path: '${{ runner.temp }}/ci-build' }
      - run: node scripts/ci-budget.mjs --assert
      - name: Publish Pages within the original run deadline
        id: d
        run: node scripts/ci-deploy.mjs
      - run: node scripts/ci-report.mjs
      - run: node scripts/ci-budget.mjs --assert
