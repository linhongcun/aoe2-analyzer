name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '待发布的版本号，例如 v0.12.0'
        required: true
        type: string
  workflow_run:
    workflows: ['CI / Deploy']
    types: [completed]
    branches: [main]
permissions: { contents: read, actions: read, checks: read }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      should_release: ${{ steps.release.outputs.should_release }}
      deployed_sha: ${{ steps.release.outputs.deployed_sha }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      ci_run_id: ${{ steps.release.outputs.ci_run_id }}
    steps:
      # Validate event data before checking out any workflow_run head, even with a read-only token.
      - name: Validate release source
        id: source
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const repository = process.env.GITHUB_REPOSITORY;
          const run = event.workflow_run;
          if (event.repository?.full_name !== repository || process.env.GITHUB_REF !== 'refs/heads/main') throw new Error('Untrusted release repository or ref');
          let sha;
          if (process.env.GITHUB_EVENT_NAME === 'workflow_run') {
            if (run?.name !== 'CI / Deploy' || run.path !== '.github/workflows/ci.yml' || run.event !== 'push' ||
                run.status !== 'completed' || run.conclusion !== 'success' || run.head_branch !== 'main' ||
                run.head_repository?.full_name !== repository || !Number.isSafeInteger(run.id) || run.id <= 0)
              throw new Error('Untrusted deployment event');
            sha = run.head_sha;
          } else if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
            const version = event.inputs?.version;
            if (typeof version !== 'string' || version !== version.trim() || !/^v\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid release version');
            sha = process.env.GITHUB_SHA;
          } else throw new Error('Unsupported release event');
          if (typeof sha !== 'string' || sha.length !== 40 || !/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid deployment SHA');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\n`);
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Prepare deployed release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-release.mjs
  release:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read, checks: read }
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      EXPECTED_DEPLOYED_SHA: ${{ needs.prepare.outputs.deployed_sha }}
      EXPECTED_RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    steps:
      # The successful deployed main SHA is immutable; never run privileged code from a PR head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.deployed_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Check package version
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const raw = execFileSync('git', ['show', process.env.EXPECTED_RELEASE_SHA + ':package.json'], { encoding: 'utf8' });
          assert.equal('v' + JSON.parse(raw).version, process.env.RELEASE_VERSION);
          NODE
      - name: Recheck deployment and restrict git pushes to the version tag
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-release.mjs --guard-git
      - run: npm ci --legacy-peer-deps
        if: steps.verify.outputs.should_release == 'true'
      - name: Download the exact deployed site
        if: steps.verify.outputs.should_release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: deployed-site
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verify.outputs.ci_run_id }}
      - name: Verify deployed artifact identity and bytes
        if: steps.verify.outputs.should_release == 'true'
        env:
          SOURCE_CI_RUN_ID: ${{ steps.verify.outputs.ci_run_id }}
        run: node scripts/site-artifact.mjs --verify
      - name: Install Playwright chromium
        if: steps.verify.outputs.should_release == 'true'
        run: npx playwright install --with-deps chromium
      - name: Verify deployment, tag and draft Release
        if: steps.verify.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'hongcun lin'
          git config user.email 'linhongcun2021@gmail.com'
          npm run release -- "$RELEASE_VERSION"
      - name: Verify changed features on the actual site
        if: steps.verify.outputs.should_release == 'true'
        run: node scripts/deployment-smoke.mjs --plan dist/build-evidence.json
      - name: Package the already deployed site
        if: steps.verify.outputs.should_release == 'true'
        env:
          SOURCE_CI_RUN_ID: ${{ steps.verify.outputs.ci_run_id }}
        run: |
          node scripts/site-artifact.mjs --verify
          asset_dir="$RUNNER_TEMP/aoe2-release"
          mkdir -p "$asset_dir"
          cd dist
          zip -q -r "$asset_dir/aoe2-analyzer-$RELEASE_VERSION.zip" .
          cd "$asset_dir"
          sha256sum "aoe2-analyzer-$RELEASE_VERSION.zip" > SHA256SUMS.txt
      - name: Upload assets and publish
        if: steps.verify.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_VERSION" "$RUNNER_TEMP/aoe2-release/aoe2-analyzer-$RELEASE_VERSION.zip" "$RUNNER_TEMP/aoe2-release/SHA256SUMS.txt" --clobber
          gh release edit "$RELEASE_VERSION" --draft=false --latest
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: release-test-results, path: test-results, if-no-files-found: ignore }
