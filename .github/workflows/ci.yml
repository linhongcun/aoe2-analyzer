name: CI / Deploy
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: 'ci-${{ github.ref }}', cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -p . --noEmit
      - name: Vitest
        run: npm test
      - name: Python tests (patch detection, diff summary, markers)
        run: npm run test:py
      - name: Design contrast check (WCAG AA)
        run: python3 docs/design/contrast.py
      # .dat（© Microsoft）只缓存在 runner，不进仓库；key 跟随固定版本
      - name: Cache pinned .dat + genieutils venv
        uses: actions/cache@v4
        with:
          path: |
            scripts/.cache/empires2_x2_p1.*.dat
            scripts/.cache/dat.*.json
            scripts/.cache/venv
          key: dat-${{ hashFiles('scripts/data_sources.json') }}-py312
      - name: Data check (dat sha256 + patch markers)
        run: npm run dat:check
      - name: Data check (effects.json reproducible from pinned dat)
        run: python3 scripts/effects_build.py && git diff --exit-code -- src/data/effects.json
      - name: Build
        run: npm run build
      - name: Playwright smoke (chromium)
        run: npx playwright install --with-deps chromium && npx playwright test --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results, if-no-files-found: ignore }
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with: { path: dist }
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    concurrency: { group: pages, cancel-in-progress: false }
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
