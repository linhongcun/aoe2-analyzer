name: CI / Deploy
on:
  push: { branches: [main, 'release/**'] }
  pull_request: { branches: [main, 'release/**'] }
  schedule:
    - cron: '17 20 * * *' # 04:17 Asia/Shanghai; background only
  workflow_dispatch:
    inputs:
      full:
        description: '完整后台回归（不部署）'
        type: boolean
        default: true
permissions: { contents: read, pull-requests: read, actions: read }
# Background runs never cancel or queue in front of delivery runs.
concurrency:
  group: ci-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'background' || 'delivery' }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI_FULL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: PR title (Conventional Commits)
        if: github.event_name == 'pull_request'
        env: { PR_TITLE: '${{ github.event.pull_request.title }}' }
        run: node scripts/check-pr-title.mjs
      - run: npm ci --legacy-peer-deps
      - name: Select affected validation plan
        id: scope
        run: node scripts/ci-scope.mjs
      - name: Reuse verified validation for the identical source tree
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-evidence.mjs --find
      - name: Lint
        if: steps.reuse.outputs.reused != 'true'
        run: npm run lint
      - name: Typecheck
        if: steps.reuse.outputs.reused != 'true'
        run: npx tsc -p . --noEmit
      - name: Unused exports report (non-blocking findings, #288)
        if: steps.reuse.outputs.reused != 'true'
        run: npm run unused:check
      - name: JSON structure and public source presentation (strict)
        if: steps.reuse.outputs.reused != 'true'
        run: npm run content:check -- --strict && node scripts/check-source-presentation.mjs && npm run content:validators -- --check
      - name: Layer boundaries (strict, #281)
        run: npm run lint:layers -- --strict
        if: steps.reuse.outputs.reused != 'true'
      - name: Catalog introduction audit
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.full == 'true'
        run: npm run introductions:check
      # Chromium is also needed to build static OG images and for short build checks.
      - name: Use Ubuntu public package mirror
        run: |
          for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$source_file" ]; then
              sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' "$source_file"
            fi
          done
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Affected unit checks
        if: steps.reuse.outputs.reused != 'true'
        run: node scripts/ci-run.mjs --unit
      - name: Python tests (patch detection, diff summary, markers)
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: npm run test:py
      - name: Design contrast check (WCAG AA)
        if: steps.reuse.outputs.reused != 'true'
        run: python3 docs/design/contrast.py
      # .dat（© Microsoft）只缓存在 runner，不进仓库；key 跟随固定版本
      - name: Cache pinned .dat + genieutils venv
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        uses: actions/cache@v4
        with:
          path: |
            scripts/.cache/empires2_x2_p1.*.dat
            scripts/.cache/dat.*.json
            scripts/.cache/venv
          key: dat-${{ hashFiles('scripts/data_sources.json') }}-py312
      - name: Data check (dat sha256 + patch markers)
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: npm run dat:check
      - name: Data check (site stats vs pinned dat; unlisted diffs fail)
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: npm run stats:check
      - name: Cache pinned aoe2techtree downloads
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        uses: actions/cache@v4
        with:
          path: scripts/.cache/aoe2techtree-*
          key: aoe2techtree-${{ hashFiles('scripts/data_sources.json') }}
      - name: Install image generation dependency
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: python3 -m pip install Pillow==12.3.0
      - name: Data check (map previews reproducible from pinned source)
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: python3 scripts/map_previews.py --check
      - name: Data check (map catalog reproducible from archived sources)
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: python3 scripts/map_catalog_build.py --check
      - name: Data check (core data, icons and pinyin reproducible)
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: python3 scripts/build_data.py && node scripts/pinyin_build.mjs && git diff --exit-code -- src/data public/img
      - name: Data check (pinyin index current)
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: npm run pinyin:check
      - name: Data check (effects.json reproducible from pinned dat)
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: python3 scripts/effects_build.py && git diff --exit-code -- src/data/effects.json
      - name: Data check (eco.json reproducible from pinned dat)
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: python3 scripts/eco_build.py && git diff --exit-code -- src/data/eco.json docs/ECO-DATA.md
      - name: Data check (market.json reproducible from pinned dat and reviewed rules)
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: python3 scripts/market_build.py --check
      - name: Data check (garrison.json reproducible from pinned dat)
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: python3 scripts/garrison_build.py --check
      - name: Data check (general garrison inputs reproducible from pinned dat)
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: python3 scripts/garrison_general_build.py --check
      - name: Data check (trade population reproducible from pinned dat)
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: python3 scripts/trade_income_build.py --check
      - name: Data check (construction inputs reproducible from pinned dat)
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: python3 scripts/construction_build.py --check
      - name: Data check (team sources reproducible from pinned dat)
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: python3 scripts/team_bonuses_build.py --check
      - name: Data check (garrison healing inputs reproducible from pinned dat)
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: python3 scripts/garrison_healing_build.py --check
      - name: Data check (relic income inputs reproducible from pinned dat)
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: python3 scripts/relic_income_build.py --check
      - name: Data check (generate-resource tasks reproducible from pinned dat)
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: python3 scripts/generate_resource_build.py --check
      - name: Patch notes match pinned data
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: |
          python3 scripts/patches_build.py --check
          python3 scripts/history_build.py --check
      - name: Build-order data check
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.data == 'true'
        run: npm run bo:check
      # Build again only to identify the actual checkout SHA in the published footer.
      - name: Build actual checkout
        run: npm run build && git diff --exit-code -- src/data/page-metadata.json
      - name: Affected browser checks
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.browser == 'true'
        run: node scripts/ci-run.mjs --e2e
      - name: Short check of the actual build
        if: steps.reuse.outputs.reused == 'true' || steps.scope.outputs.browser != 'true'
        run: |
          python3 -m http.server 4189 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/build-smoke-server.log" 2>&1 &
          smoke_pid=$!
          trap 'kill "$smoke_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          const end = Date.now() + 5000;
          for (;;) {
            try { const response = await fetch('http://127.0.0.1:4189/'); if (response.ok) break; } catch {}
            if (Date.now() >= end) throw new Error('Local build server did not become ready');
            await new Promise(resolve => setTimeout(resolve, 100));
          }
          NODE
          node scripts/deployment-smoke.mjs --site http://127.0.0.1:4189/ --plan "$RUNNER_TEMP/ci-plan.json"
      - name: Record completed validation and provenance
        run: node scripts/ci-evidence.mjs --record
      - name: Save validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-evidence
          overwrite: true
          path: ${{ runner.temp }}/ci-evidence.json
          if-no-files-found: error
      - name: Save affected viewport screenshots
        uses: actions/upload-artifact@v4
        if: always() && steps.reuse.outputs.reused != 'true' && steps.scope.outputs.browser == 'true'
        with:
          name: editorial-viewport-screenshots
          overwrite: true
          path: test-results/**/*.png
          if-no-files-found: ignore
      - name: Save cold page JavaScript budgets
        uses: actions/upload-artifact@v4
        if: always() && steps.reuse.outputs.reused != 'true' && steps.scope.outputs.browser == 'true'
        with:
          name: page-js-budgets
          overwrite: true
          path: test-results/**/cold-js-raw-bytes.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results, if-no-files-found: ignore, overwrite: true }
      - name: Identify the exact Pages and ZIP artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/site-artifact.mjs --write
      - name: Save deployed site for Release
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: deployed-site
          overwrite: true
          path: dist
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with: { path: dist }
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    concurrency: { group: pages, cancel-in-progress: false }
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
